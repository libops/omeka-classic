---
x-common: &common
  restart: unless-stopped
  networks:
    default:

networks:
  default:

volumes:
  mariadb-data: {}
  omeka-classic-files: {}

secrets:
  DB_ROOT_PASSWORD:
    file: ./secrets/DB_ROOT_PASSWORD
  OMEKA_CLASSIC_DB_PASSWORD:
    file: ./secrets/OMEKA_CLASSIC_DB_PASSWORD
  OMEKA_CLASSIC_ADMIN_PASSWORD:
    file: ./secrets/OMEKA_CLASSIC_ADMIN_PASSWORD

services:
  init:
    image: libops/base:3.2.2.0@sha256:57b396fd8b681d626c89359e3f68618d4822f46c9364854c9d4747c25ab9d705
    restart: no
    working_dir: /work
    environment:
      COMPOSE_FILE: /work/compose.yaml
      SECRETS_ROOT: /work/secrets
    volumes:
      - ./certs:/work/certs:rw,z
      - ./secrets:/work/secrets:rw,z
      - ./compose.yaml:/work/compose.yaml:ro,z
    entrypoint: generate-compose-secrets.sh
    profiles: [none]

  traefik:
    <<: *common
    image: traefik:v3.7.11@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
    command:
      - --ping=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=300s
    ports:
      - "80:80"
    volumes:
      - ./conf/traefik:/etc/traefik/dynamic:ro,z
    depends_on:
      omeka-classic:
        condition: service_healthy
    healthcheck:
      test: traefik healthcheck --ping
      start_period: 10s

  omeka-classic:
    <<: *common
    build:
      context: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      INGRESS_HOSTNAMES: "localhost"
      INGRESS_SCHEME: "http"
      LIBOPS_SMTP_HOST: "${LIBOPS_SMTP_HOST:-host.docker.internal}"
      LIBOPS_SMTP_PORT: "${LIBOPS_SMTP_PORT:-25}"
      SMTP_FROM: "${SMTP_FROM:-}"
    secrets:
      - source: OMEKA_CLASSIC_DB_PASSWORD
        target: DB_PASSWORD
      - source: OMEKA_CLASSIC_ADMIN_PASSWORD
    volumes:
      - omeka-classic-files:/var/www/omeka-classic/files:rw
      - ./scripts/omeka-classic-rollout.sh:/usr/local/bin/sitectl-omeka-classic-rollout:ro,z
      - ./scripts/omeka-classic-verify-database.sh:/usr/local/bin/sitectl-omeka-classic-verify-database:ro,z
      - ./scripts/omeka-classic-verify-storage.sh:/usr/local/bin/sitectl-omeka-classic-verify-storage:ro,z
      - ./scripts/omeka-classic-database-config.php:/usr/local/share/libops/sitectl-omeka-classic-database-config.php:ro,z
      - ./scripts/omeka-classic-inspect.php:/usr/local/share/libops/sitectl-omeka-classic-inspect.php:ro,z
      - ./scripts/omeka-classic-verify.sql:/usr/local/share/libops/sitectl-omeka-classic-verify.sql:ro,z
    depends_on:
      database-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /installed && test -f /var/www/omeka-classic/index.php && wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5m

  database-init:
    image: libops/base:3.2.2.0@sha256:57b396fd8b681d626c89359e3f68618d4822f46c9364854c9d4747c25ab9d705
    restart: "no"
    networks:
      default:
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: omeka_classic
      DB_USER: omeka_classic
      DB_CHARACTER_SET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
    secrets:
      - source: DB_ROOT_PASSWORD
      - source: OMEKA_CLASSIC_DB_PASSWORD
        target: DB_PASSWORD
    entrypoint: /usr/local/bin/init-database.sh
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    <<: *common
    image: libops/mariadb:11@sha256:52bc6b83b75921239237d57db7b14fb7cbcecafee6ce110c49fd31d990ec0828
    volumes:
      - mariadb-data:/var/lib/mysql:rw
    secrets:
      - source: DB_ROOT_PASSWORD
